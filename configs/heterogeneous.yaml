# Stage 4 heterogeneous example — the methodology's three-node scenario:
# "one lower-capacity sensing node, one medium-capacity actuation node,
#  and one higher-capacity helper node."
#
# New Stage 4 knobs demonstrated here:
#   node_profiles       - named presets; nodes reference them via `profile`
#                         and may override individual fields.
#   cpu_speed           - work units each worker drains per second
#                         (0.5 = half-speed device: same task takes 2x longer).
#   queue_limit         - max tasks a node will hold; full nodes are skipped
#                         by the allocator. If NO node (incl. the source) has
#                         room, the task is dropped and logged as lost.
#   accepts_task_types  - task-type suitability; omitted = accepts everything.
#   memory_capacity     - now enforced: active tasks' memory can't exceed it
#                         (queued tasks wait for memory, FIFO order kept).

seed: 42
sim_duration: 300.0
dt: 0.01   # standard experiment resolution (DESIGN.md decision 36)

node_profiles:
  sensor_class:        # low-power sensing device (Raspberry-Pi-ish)
    cpu_capacity: 1.0
    cpu_speed: 0.5
    memory_capacity: 2.0
    queue_limit: 5
    accepts_task_types: [telemetry]
  actuation_class:     # mid-range actuation gateway
    cpu_capacity: 2.0
    cpu_speed: 1.0
    memory_capacity: 4.0
    queue_limit: 10
    accepts_task_types: [telemetry, actuation]
  edge_server:         # rack helper: fast, roomy, takes anything
    cpu_capacity: 8.0
    cpu_speed: 2.0
    memory_capacity: 16.0
    # no queue_limit, no accepts_task_types: unlimited backlog, all types

network:
  type: fluid_link      # try varying_fluid_link for drifting link quality
  default_profile: wifi # built-in profiles now carry realistic jitter
  links:
    - from: node_act
      to: node_server
      profile: lan      # the gateway has a wired hop to the server

controllers:
  - id: ctrl_main
    allocator:
      type: load_aware
    manages: [node_sense, node_act, node_server]
    parent: null

nodes:
  - id: node_sense
    type: source
    profile: sensor_class
    tier: edge
    source:
      generator:
        type: poisson
        rate: 0.6
        task_type: telemetry
        cpu_demand: 1.0
        memory_demand: 0.5
        data_size: 200000     # bytes (200 KB sensor batch)
        result_size: 10000    # bytes back to the source; deadline counts the return trip
        deadline_offset: 10.0

  - id: node_act
    type: source
    profile: actuation_class
    tier: edge
    source:
      generator:
        type: poisson
        rate: 0.4
        task_type: actuation
        cpu_demand: 2.0
        memory_demand: 1.0
        data_size: 50000      # bytes (50 KB control payload)
        result_size: 5000     # bytes (actuation acknowledgement)
        deadline_offset: 5.0

  - id: node_server
    type: helper
    profile: edge_server
    tier: edge

logging:
  output_dir: logs/heterogeneous_run01
  log_state_every: 1.0
